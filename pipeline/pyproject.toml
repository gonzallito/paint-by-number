[project]
name = "pbn-pipeline"
version = "0.1.0"
description = "Photo to color-by-number conversion pipeline"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "pillow>=10.4",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Subject segmentation. Heavy (pulls onnxruntime + model weights on first run),
# so it is isolated here to keep the base pipeline installable and fast.
# Install with: uv sync --extra segmentation
segmentation = [
    "rembg>=2.0.59",
    "onnxruntime>=1.19",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
pbn = "pbn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pbn"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
