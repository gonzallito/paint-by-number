<!doctype html>
<meta charset="utf-8">
<title>Content build review</title>
<style>
  body { background:#101012; color:#E8E8EE; font:14px/1.4 system-ui, sans-serif; margin:24px; }
  h1 { font-size:18px; font-weight:600; }
  .summary { color:#8A8A94; margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  .card { background:#17171A; border-radius:10px; overflow:hidden; }
  .card img { width:100%; display:block; background:#000; }
  .body { padding:10px 12px 12px; }
  .title { font-weight:600; margin-bottom:2px; }
  .meta, .metrics { color:#8A8A94; font-size:12px; }
  .status { font-size:11px; font-weight:700; letter-spacing:.06em; margin:6px 0 4px; }
  .fail { color:#FFC9CF; font-size:12px; margin-top:6px; }
</style>
<h1>Content build review</h1>
<div class="summary">
  1 built &middot; 0 unchanged &middot;
  0 rejected &middot; 0 errored
  &mdash; conversion version 2
</div>
<div class="grid">
<div class="card">
  <img src="build/green-uniform/preview.webp" loading="lazy" alt="green-uniform">
  <div class="body">
    <div class="title">Green Uniform</div>
    <div class="meta">daily &middot; daily</div>
    <div class="status" style="color:#6BDF8A">BUILT</div>
    <div class="metrics">26 regions &middot;
      11 colours &middot;
      min tap 23px</div>
    <div class="fail"></div>
  </div>
</div>
</div>
